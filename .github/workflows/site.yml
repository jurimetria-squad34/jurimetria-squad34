name: CI do Site

on:
  push:
    paths:
      - 'site/**'
      - 'observatorio/dados/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'observatorio/dados/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run extrair-universo
      - run: npm run extrair-recortes
      - run: npm run extrair-relatores
      - run: npm run test
      - run: npm run build
        env:
          PUBLIC_FORMSPREE_URL: https://formspree.io/f/ci-build
