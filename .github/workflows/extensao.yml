name: extensao

on:
  push:
    paths:
      - "extensao/**"
      - ".github/workflows/extensao.yml"
  pull_request:
    paths:
      - "extensao/**"
      - ".github/workflows/extensao.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensao/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
