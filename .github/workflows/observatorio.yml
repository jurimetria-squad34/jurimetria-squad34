name: CI do observatório

on:
  pull_request:
    paths:
      - "observatorio/**"
      - ".github/workflows/observatorio.yml"
  push:
    paths:
      - "observatorio/**"
      - ".github/workflows/observatorio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observatorio-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: observatorio

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node (a versão vem do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: observatorio/.nvmrc
          cache: npm
          cache-dependency-path: observatorio/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run check

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build